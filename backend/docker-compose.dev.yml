
services:
  backend:
    build:
      context: .
    container_name: fastapi-backend-dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app  # Reflect code changes
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7
    container_name: redis-cache-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data-dev:/data
    restart: unless-stopped

volumes:
  redis-data-dev: